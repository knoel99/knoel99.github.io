# Campagne du palier 2 (thèse) : dynamo cinématique de l'écoulement ABC (A = B = C = 1), balayage en Rm.
#
# Équation d'induction seule, u imposé (ABC, kf = 1, boîte 2π) : Rm = 1/η (convention de E3).
# Repères mesurés par experiences/e3_abc.py à 32³ : λ < 0 pour Rm < 8,87, fenêtre de dynamo
# 8,87 < Rm < 17,6 (λ max ≈ 0,008 vers Rm = 12), λ < 0 jusqu'à 26,8, puis λ > 0 au-delà.
# Le problème étant linéaire, B est renormalisé (‖B‖ = 1 à chaque sortie) ; l'amplitude vraie
# est le diagnostic log_b_rms et le taux de croissance ajusté est enregistré au catalogue
# (diagnostic growth_rate_fit, notes de la simulation). Sortie : modes propres dominants B(x; Rm).
#
# Coût : mesuré sur CPU (2 fils, machine partagée) ≈ 0,03 s par pas et par trajectoire à 64³ en
# cinématique (≈ 1/3 à 1/2 du mode dynamique, voir milady/sim/mhd3d.py, BENCHMARK_NOTES) ; le pas
# effectif est fixé par la condition CFL (≈ 0,01 à 64³). Sur GPU, mesurer d'abord
#   python -m milady.sim.mhd3d bench --n 64 --mode kinematic --device cuda
# puis ajuster resources.time (gabarit Slurm) en conséquence.
#
# Lancer :   make sweep CONFIG=infra/configs/palier2_abc3d.yaml                         (VM, Docker)
#            python -m milady.sweep infra/configs/palier2_abc3d.yaml --scheduler slurm   (cluster)
name: palier2_abc3d
description: >-
  Dynamo cinématique ABC 1:1:1 à 64³ : Rm de 4 à 40 (pas 1), 2 germes magnétiques aléatoires par Rm,
  20 instantanés du champ magnétique renormalisé après 150 unités de temps de transitoire.
code: mhd3d_torch
grid:
  N: 64
  domain: 2pi
fixed:
  mode: kinematic
  flow: abc
  abc_A: 1.0
  abc_B: 1.0
  abc_C: 1.0
  kf: 1
  U_ref: 1.0
  b0_amp: 1.0
sweep:
  Rm: {start: 4, stop: 40, step: 1}    # 37 simulations
runtime:
  dt: 0.02                # pas maximal ; réduit automatiquement par la condition CFL
  cfl: 1.0
  t_burn: 150.0           # transitoire : les modes sous-dominants décroissent (λ ~ 1e-2 près des seuils)
  t_keep: 100.0
  every: 5.0              # 20 instantanés
  diag_every: 0.5         # séries temporelles (ln‖B‖, hélicités…) pour l'ajustement de λ
  n_traj: 2
  device: auto
  dtype: float32
  checkpoint_every_s: 900
  checkpoint_to_storage: false   # true sur instance interruptible : point de contrôle aussi dans S3
resources:
  gpus: 1
  cpus: 8
  time: "02:00:00"
  mem: null
  max_parallel: 16
output:
  format: mff
  uri: ${MILADY_STORAGE_URI}
  fields: [velocity, magnetic_field]   # u est constant en cinématique : retirer « velocity » pour gagner ~50 %
  spectral: false
  dataset_name: milady_palier2_abc3d
