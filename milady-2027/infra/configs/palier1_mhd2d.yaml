# Campagne du palier 1 (stage) : MHD 2D forcée, balayage en diffusivité magnétique η.
#
# Reprend le jeu de données de l'expérience E2 (experiences/e2_donnees.py) avec le solveur
# experiences/mhd2d.py, réutilisé tel quel : grille 32², ν = 8e-3, frottement α = 0,02, forçage blanc
# dans la bande 2 ≤ |k| ≤ 3 d'injection 0,05 (vorticité et potentiel). Les 11 valeurs de η sont
# celles de E2 (η_train ∪ η_test = 4e-3 × 2^(j/4), j = 0…10, soit Pm = ν/η de 2 à ≈ 0,35).
# Différence avec E2 : la graine de chaque simulation est son indice dans la campagne (E2 :
# 100 + i pour l'entraînement, 200 + i pour la référence) — mêmes lois, autres tirages.
#
# Lancer :   make sweep CONFIG=infra/configs/palier1_mhd2d.yaml            (CPU, quelques minutes / simulation)
#            python -m milady.sweep infra/configs/palier1_mhd2d.yaml --scheduler local --max-parallel 4
name: palier1_mhd2d
description: >-
  MHD 2D forcée (E2) : 11 valeurs de η entre 4e-3 et 2,26e-2 (ν = 8e-3), 16 trajectoires indépendantes
  par valeur, 150 instantanés par trajectoire après 30 unités de temps de mise en régime.
code: mhd2d_numpy
grid:
  N: 32
  domain: 2pi            # le solveur 2D ne connaît que [0, 2π)²
fixed:
  nu: 8.0e-3
  alpha: 0.02
  kf_min: 2.0
  kf_max: 3.0
  eps_u: 0.05
  eps_b: 0.05
sweep:
  eta: {start: 4.0e-3, stop: 2.2627416997969524e-2, num: 11, scale: log}
runtime:
  dt: 0.01               # pas fixe (forçage blanc en temps) ; les instants de sortie en sont des multiples
  t_burn: 30.0
  t_keep: 150.0
  every: 1.0             # 150 instantanés
  diag_every: 0.5
  n_traj: 16             # « membres » de E2 : trajectoires indépendantes intégrées ensemble
  checkpoint_every_s: 600
resources:
  gpus: 0                # NumPy, CPU seulement
  cpus: 2
  time: "02:00:00"
  mem: 4G
  max_parallel: 11
output:
  format: mff
  uri: ${MILADY_STORAGE_URI}   # vide → milady.storage.base_uri() (data/store en mode portable)
  fields: [velocity, magnetic_field]
  spectral: false
  dataset_name: milady_palier1_mhd2d
